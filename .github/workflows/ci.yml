name: CI

# The repository is public: Actions minutes are free, so every pull request is checked, on
# Linux and on Windows, and main after each merge. Documentation changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compiling the tests is most of a run (about 75%); nothing here reads their debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The 49 test programs of a run are linked one by one: on Windows by the fast linker Rust ships.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  check:
    # Windows proves cross-platform determinism: the pinned hashes must match Linux bit for bit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on the dependencies only; a profile change (opt-level of the
          # dependencies) then restored a "full match" built with other flags, and every
          # dependency was rebuilt on every run without the cache ever being refreshed.
          key: ${{ hashFiles('Cargo.toml') }}
      # OpenCASCADE reads the STEP the reference models give back (D130), on Linux.
      - if: runner.os == 'Linux'
        run: pip install --user cadquery-ocp
      - run: scripts/check.sh
        shell: bash
