name: CI

# Actions minutes are limited (2000 a month, Windows counted double), so CI runs once per merge,
# not on every push to a pull request: before a PR the same checks run locally, on Linux and on
# Windows. A PR can still be checked by hand (workflow_dispatch). Documentation changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push to main supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Windows proves cross-platform determinism: the pinned hashes must match Linux bit for bit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on the dependencies only; a profile change (opt-level of the
          # dependencies) then restored a "full match" built with other flags, and every
          # dependency was rebuilt on every run without the cache ever being refreshed.
          key: ${{ hashFiles('Cargo.toml') }}
      - run: scripts/check.sh
        shell: bash
