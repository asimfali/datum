[package]
name = "datum-view"
description = "Viewer of Datum models: egui + wgpu window, headless pictures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
datum-math = { workspace = true }
datum-brep = { workspace = true }
datum-graph = { workspace = true }
datum-ops = { workspace = true }
datum-sketch = { workspace = true }
datum-model = { workspace = true }
libm = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }
serde = { workspace = true }
sys-locale = { workspace = true }
pollster = { workspace = true }
png = { workspace = true }
rfd = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
