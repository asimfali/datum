[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.4.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asimfali/datum"

[workspace.dependencies]
datum-math = { path = "crates/datum-math" }
datum-brep = { path = "crates/datum-brep" }
datum-ops = { path = "crates/datum-ops" }
datum-graph = { path = "crates/datum-graph" }
datum-model = { path = "crates/datum-model" }
blake3 = "1.8"
robust = "1.2"
libm = "0.2"
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
datum-mcp = { path = "crates/datum-mcp" }
datum-sketch = { path = "crates/datum-sketch" }
datum-table = { path = "crates/datum-table" }
proptest = "1.12"
rayon = "1.12"
criterion = { version = "0.8", default-features = false }
smallvec = "1.15"
datum-view = { path = "crates/datum-view" }
# The viewer (M4): the same egui stack as CADCraft (D13).
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
pollster = "0.4"
png = "0.18"
rfd = "0.17"
sys-locale = "0.3"
egui_kittest = "0.36"

[workspace.lints.rust]
# Denied, not forbidden: the one exception (Windows, `datum-cli`) is allowed where it stands.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = "line-tables-only"

# Geometry is hot even in tests (the 10 000-hole reference model); debug assertions stay on.
# Only what the kernel computes with is optimised: the GUI stack (egui, wgpu) costs minutes to
# optimise and nothing to run unoptimised in tests.
[profile.dev.package.blake3]
opt-level = 2

[profile.dev.package.robust]
opt-level = 2

[profile.dev.package.libm]
opt-level = 2

[profile.dev.package.num-bigint]
opt-level = 2

[profile.dev.package.num-integer]
opt-level = 2

[profile.dev.package.num-traits]
opt-level = 2

[profile.dev.package.rayon]
opt-level = 2

[profile.dev.package.rayon-core]
opt-level = 2

[profile.dev.package.smallvec]
opt-level = 2

[profile.dev.package.crossbeam-deque]
opt-level = 2

[profile.dev.package.crossbeam-epoch]
opt-level = 2

[profile.dev.package.crossbeam-utils]
opt-level = 2

[profile.dev.package.datum-math]
opt-level = 2

[profile.dev.package.datum-brep]
opt-level = 2

[profile.dev.package.datum-ops]
opt-level = 2
