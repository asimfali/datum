[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asimfali/datum"

[workspace.dependencies]
datum-math = { path = "crates/datum-math" }
datum-brep = { path = "crates/datum-brep" }
datum-ops = { path = "crates/datum-ops" }
datum-graph = { path = "crates/datum-graph" }
datum-model = { path = "crates/datum-model" }
blake3 = "1.8"
robust = "1.2"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1.12"
rayon = "1.12"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = "line-tables-only"
