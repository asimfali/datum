[package]
name = "datum-cli"
description = "Command-line front end of the Datum kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "datum"

[[bin]]
name = "datum"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
datum-math = { workspace = true }
datum-brep = { workspace = true }
datum-graph = { workspace = true }
datum-model = { workspace = true }
datum-mcp = { workspace = true }
rayon = { workspace = true }
datum-view = { workspace = true }

[[bin]]
name = "datum-view"
path = "src/bin/datum-view.rs"
